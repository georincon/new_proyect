# Proxy inverso del VDR de extensión: canales SEPARADOS.
#  - :443  -> LECTURA pública (solo GET/HEAD de */did.json y el camino base)
#  - :8443 -> ESCRITURA autenticada (mTLS obligatorio; reenvía identidad del certificado a la aplicación)
#            + portales de administración del emisor y del verificador (mTLS + token; ERSo 002)
#  - :8444 -> CARTERA Y CREDENCIALES para dispositivos de ciudadanos (TLS de servidor; ERSo 001/002/003):
#            API del Wallet Backend, endpoints OpenID4VCI y OpenID4VP. Sin portales de administración.
events {}

http {
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;

    # DNS interno de Docker, resuelto en cada petición: si wallet o credential no están arriba, solo ESOS caminos fallan (502);
    # el VDR y el camino base siguen funcionando (no se cae nginx al arrancar).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ---------------- canal público de lectura ----------------
    server {
        listen 443 ssl;
        server_name civica-desarrollo.avance.org.co localhost;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        add_header X-Content-Type-Options nosniff always;

        location = /health    { proxy_pass http://vdr:8080; }
        location = /base/ping { proxy_pass http://vdr:8080; }

        location ~ /did\.json$ {
            limit_except GET HEAD { deny all; }
            proxy_pass http://vdr:8080;
        }

        location / { return 404; }
    }

    # ---------------- canal de escritura (mTLS) ----------------
    server {
        listen 8443 ssl;
        server_name civica-desarrollo.avance.org.co localhost;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;

        # Portales de administración (Issuer/Verifier Admin Portal): solo por este canal, además exigen su token.
        location ~ ^/admin/(offers|verifier/requests|execution-log) {
            set $credential_upstream http://credential:8100;
            proxy_pass $credential_upstream;
        }

        location /admin/v1/ {
            # Se SOBRESCRIBEN siempre: un cliente no puede falsificar su identidad con encabezados propios.
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
            proxy_pass http://vdr:8081;
        }

        location / { return 404; }
    }

    # ---------------- canal de cartera y credenciales (ciudadanos) ----------------
    server {
        listen 8444 ssl;
        server_name civica-desarrollo.avance.org.co localhost;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        add_header X-Content-Type-Options nosniff always;
        client_max_body_size 256k;

        # API del Wallet Backend (gestión de cartera y del DID del titular)
        location /wallet/v1/ { set $wallet_upstream http://wallet:8090; proxy_pass $wallet_upstream; }

        # OpenID4VCI 1.0 (emisión) y OpenID4VP 1.0 (presentación): los únicos endpoints de credenciales
        location = /.well-known/openid-credential-issuer   { limit_except GET  { deny all; } set $credential_upstream http://credential:8100; proxy_pass $credential_upstream; }
        location = /.well-known/oauth-authorization-server { limit_except GET  { deny all; } set $credential_upstream http://credential:8100; proxy_pass $credential_upstream; }
        location = /token                                  { limit_except POST { deny all; } set $credential_upstream http://credential:8100; proxy_pass $credential_upstream; }
        location = /nonce                                  { limit_except POST { deny all; } set $credential_upstream http://credential:8100; proxy_pass $credential_upstream; }
        location = /credential                             { limit_except POST { deny all; } set $credential_upstream http://credential:8100; proxy_pass $credential_upstream; }
        location = /verifier/response                      { limit_except POST { deny all; } set $credential_upstream http://credential:8100; proxy_pass $credential_upstream; }

        location / { return 404; }
    }
}
